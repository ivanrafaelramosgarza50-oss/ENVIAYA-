<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EnvíaYa — Aguascalientes</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root { --navy: #0A3D91; --orange: #FF7A00; --bg: #F3F4F6; --white: #FFFFFF; --dark: #1F2937; }
body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; color: var(--dark); overflow: hidden; }

/* Sistema de Pantallas */
.scr { display: none; flex-direction: column; height: 100vh; width: 100vw; box-sizing: border-box; position: absolute; top: 0; left: 0; }
.scr.on { display: flex; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Scroll para Registro y Login */
#s-login, #s-reg { overflow-y: auto; padding: 20px; }

/* Panel Cliente con Mapa Expandido */
#s-cliente { display: none; flex-direction: column; padding: 0; }
#s-cliente.on { display: flex; }
#map { flex-grow: 1; width: 100%; z-index: 1; }

.panel-controles { 
    background: var(--white); 
    padding: 20px; 
    border-radius: 25px 25px 0 0; 
    box-shadow: 0 -5px 15px rgba(0,0,0,0.1);
    z-index: 10;
    max-height: 70vh;
    overflow-y: auto;
}

/* UI Components */
.input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
.btn { width: 100%; padding: 15px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; margin-bottom: 8px; }
.btn-ok { background: var(--navy); color: var(--white); }
.btn-warn { background: var(--orange); color: var(--white); }

/* Cotizador */
.box-costo { background: #fdf2e9; border: 2px solid var(--orange); border-radius: 12px; padding: 15px; margin-bottom: 15px; text-align: center; }
.costo-total { font-size: 24px; font-weight: 800; color: var(--navy); }

.card-f2 { background: #E5EBF5; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 5px solid var(--orange); }
.hidden { display: none !important; }
.chk-label { display: flex; align-items: flex-start; gap: 10px; font-size: 11px; margin-bottom: 10px; cursor: pointer; }
</style>
</head>
<body>

<div id="s-login" class="scr on">
    <div style="text-align:center; margin: 40px 0;">
        <h1 style="color: var(--navy); margin:0; font-weight:800; font-size:35px;">EnvíaYa</h1>
        <p style="color: var(--orange); font-weight:600; font-size:11px; letter-spacing:2px;">LOGÍSTICA AGUASCALIENTES</p>
    </div>
    <input type="email" id="log-email" placeholder="Correo electrónico" class="input">
    <input type="password" id="log-pass" placeholder="Contraseña" class="input">
    <button class="btn btn-ok" onclick="doLogin()">ENTRAR</button>
    <p style="text-align:center; font-size:14px;">¿No tienes cuenta? <a href="#" onclick="ir('s-reg')" style="color: var(--orange); font-weight:bold; text-decoration:none;">Regístrate</a></p>
</div>

<div id="s-reg" class="scr">
    <h2 style="color: var(--navy);">Crear Cuenta</h2>
    <input type="text" id="reg-nom" placeholder="Nombre completo" class="input">
    <input type="email" id="reg-email" placeholder="Correo electrónico" class="input">
    <input type="password" id="reg-pass" placeholder="Contraseña (mín. 6 caracteres)" class="input">
    <input type="tel" id="reg-tel" placeholder="Teléfono" class="input">
    <select id="reg-rol" class="input" onchange="toggleVehiculo()">
        <option value="cliente">Soy Cliente</option>
        <option value="conductor">Soy Conductor</option>
    </select>

    <div id="sec-v" class="hidden card-f2">
        <select id="reg-v-tipo" class="input">
            <option value="">Tipo Vehículo...</option>
            <option value="moto">Moto</option><option value="auto">Sedán</option><option value="reparto">Van de Carga</option>
        </select>
        <select id="reg-v-marca" class="input" onchange="actualizarModelos()"><option value="">Marca...</option></select>
        <select id="reg-v-modelo" class="input"><option value="">Modelo...</option></select>
        <input type="text" id="reg-v-placas" placeholder="Placas" class="input">
    </div>

    <button class="btn btn-ok" onclick="doRegister()">FINALIZAR REGISTRO</button>
    <button class="btn" onclick="ir('s-login')" style="background:none; color:var(--navy);">Volver</button>
</div>

<div id="s-cliente" class="scr">
    <div id="map"></div>
    
    <div class="panel-controles">
        <div id="box-cotizacion" class="box-costo hidden">
            <div style="font-size: 11px; color: var(--orange); font-weight: bold;">COTIZACIÓN ESTIMADA</div>
            <div id="txt-dist" style="font-size: 12px; color: gray;">Distancia: 0 km</div>
            <div class="costo-total" id="txt-precio">$0.00</div>
        </div>

        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:10px;">
            <span style="font-weight:800; color:var(--navy);">RECOLECCIÓN Y ENTREGA</span>
            <button onclick="obtenerUbicacionActual()" class="btn" style="width:auto; margin:0; padding:8px 12px; background:var(--orange); color:white; font-size:10px;">📍 MI GPS</button>
        </div>

        <input type="text" id="c-ori" placeholder="📍 Origen (Toca el mapa)" class="input" readonly>
        <input type="text" id="c-ref-ori" placeholder="🏠 Ref. Recogida (Ejem: Casa portón negro)" class="input">
        
        <input type="text" id="c-des" placeholder="🏁 Destino (Toca el mapa)" class="input" readonly>
        <input type="text" id="c-ref-des" placeholder="🏢 Ref. Entrega (Ejem: Local frente al OXXO)" class="input">

        <label class="chk-label">
            <input type="checkbox" id="chk-seguridad"> 
            Confirmo que el envío cumple con las políticas de seguridad.
        </label>

        <button class="btn btn-ok" onclick="solicitarServicio()" id="btn-solicitar">SOLICITAR SERVICIO</button>
        <button onclick="location.reload()" style="background:none; border:none; color:red; font-size:12px; width:100%; cursor:pointer; margin-top:10px;">Cerrar Sesión</button>
    </div>
</div>

    if (MAP) return;
    MAP = L.map('map', { zoomControl: false }).setView([21.8853, -102.2916], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(MAP);

        const tipo = confirm("¿Marcar este punto como ORIGEN?") ? 'ori' : 'des';
        fijarPunto(e.latlng.lat, e.latlng.lng, tipo);
    });
}
