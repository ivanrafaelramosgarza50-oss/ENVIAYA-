<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnvíaYa — Aguascalientes Premium</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --navy: #0A3D91; --orange: #FF7A00; --green: #2ecc71; --bg: #F3F4F6; --white: #FFFFFF; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; color: #333; overflow-x: hidden; }

        .scr { display: none; min-height: 100vh; flex-direction: column; }
        .scr.on { display: flex; }

        #map-wrapper { width: 100%; height: 35vh; position: relative; background: #e0e0e0; z-index: 1; border-bottom: 3px solid var(--navy); }
        #map { height: 100%; width: 100%; }

        .content { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; box-sizing: border-box; font-family: inherit; outline: none; }
        
        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; transition: 0.3s; }
        .btn-ok { background: var(--navy); color: white; }

        /* Estilos de Historial y Cards */
        .card-pedido { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 10px; border-left: 5px solid var(--navy); }
        .status-tag { font-size: 10px; padding: 4px 8px; border-radius: 20px; font-weight: 800; text-transform: uppercase; }
        .status-buscando { background: #ffeaa7; color: #d6a000; }
        .status-camino { background: #d1f2eb; color: #1abc9c; }

        .login-header { text-align: center; padding: 40px 20px; }
        .login-header h1 { color: var(--navy); font-weight: 800; margin: 0; font-size: 32px; }
    </style>
</head>
<body>

<div id="s-login" class="scr on">
    <div class="login-header"><h1>EnvíaYa</h1><p>LOGÍSTICA PREMIUM</p></div>
    <div class="content">
        <input type="email" id="log-email" placeholder="Correo" class="input">
        <input type="password" id="log-pass" placeholder="Contraseña" class="input">
        <button class="btn btn-ok" onclick="doLogin()">ENTRAR</button>
        <p style="text-align:center;">¿No tienes cuenta? <a href="#" onclick="ir('s-reg')">Regístrate</a></p>
    </div>
</div>

<div id="s-reg" class="scr">
    <div class="content">
        <h2>Registro</h2>
        <input type="text" id="reg-nom" placeholder="Nombre" class="input">
        <input type="email" id="reg-email" placeholder="Correo" class="input">
        <input type="password" id="reg-pass" placeholder="Contraseña" class="input">
        <select id="reg-rol" class="input">
            <option value="cliente">Soy Cliente</option>
            <option value="conductor">Soy Conductor</option>
        </select>
        <button class="btn btn-ok" onclick="doRegister()">REGISTRARME</button>
    </div>
</div>

<div id="s-cliente" class="scr">
    <div id="map-wrapper"><div id="map"></div></div>
    <div class="content">
        <input type="text" id="c-ori" placeholder="Origen" class="input">
        <input type="text" id="c-des" placeholder="Destino" class="input">
        <button class="btn btn-ok" onclick="enviarPedidoFinal()">SOLICITAR ENVÍO</button>
        
        <h3 style="margin-top:20px;">Mis Pedidos Recientes</h3>
        <div id="lista-historial">
            </div>
        <button onclick="cerrarSesion()" style="color:red; background:none; border:none; margin-top:20px;">Cerrar Sesión</button>
    </div>
</div>

<div id="s-conductor" class="scr">
    <div class="content">
        <div style="background:var(--navy); color:white; padding:20px; border-radius:0 0 20px 20px; margin:-15px -15px 10px -15px;">
            <h2>Panel Conductor</h2>
            <p>Pedidos disponibles en Aguascalientes</p>
        </div>
        <div id="pedidos-disponibles">
            </div>
        <button onclick="cerrarSesion()" style="color:red; background:none; border:none; margin-top:20px;">Cerrar Sesión</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC-X3BN11rTG66DWe3njD81zZh_oy5p2hY",
        authDomain: "enviaya-d8f34.firebaseapp.com",
        projectId: "enviaya-d8f34",
        storageBucket: "enviaya-d8f34.firebasestorage.app",
        messagingSenderId: "491320152351",
        appId: "1:491320152351:web:9bde727d7edaf2d5f3e02a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // --- LÓGICA DE ROLES AL ENTRAR ---
    window.doLogin = async () => {
        const email = document.getElementById('log-email').value;
        const pass = document.getElementById('log-pass').value;
        try {
            const res = await signInWithEmailAndPassword(auth, email, pass);
            gestionarRedireccion(res.user.uid);
        } catch (e) { alert("Credenciales incorrectas"); }
    };

    async function gestionarRedireccion(uid) {
        const paf = await getDoc(doc(db, "usuarios", uid));
        if (paf.exists()) {
            const rol = paf.data().rol;
            if (rol === "conductor") {
                ir('s-conductor');
                cargarPedidosDisponibles();
            } else {
                ir('s-cliente');
                cargarHistorialCliente(uid);
            }
        }
    }

    // --- HISTORIAL DEL CLIENTE (TIEMPO REAL) ---
    function cargarHistorialCliente(uid) {
        const q = query(collection(db, "pedidos"), where("clienteId", "==", uid));
        onSnapshot(q, (snapshot) => {
            const contenedor = document.getElementById('lista-historial');
            contenedor.innerHTML = '';
            snapshot.forEach(doc => {
                const p = doc.data();
                contenedor.innerHTML += `
                    <div class="card-pedido">
                        <div style="display:flex; justify-content:space-between;">
                            <strong>${p.descripcion || 'Envío'}</strong>
                            <span class="status-tag status-${p.estado}">${p.estado}</span>
                        </div>
                        <p style="font-size:12px; margin:5px 0;">De: ${p.origen.substring(0,30)}...</p>
                        <p style="font-size:12px; margin:5px 0;">A: ${p.destino.substring(0,30)}...</p>
                        <div style="color:var(--navy); font-weight:700;">${p.monto || '$0'}</div>
                    </div>
                `;
            });
        });
    }

    // --- PANEL CONDUCTOR ---
    function cargarPedidosDisponibles() {
        const q = query(collection(db, "pedidos"), where("estado", "==", "buscando"));
        onSnapshot(q, (snapshot) => {
            const contenedor = document.getElementById('pedidos-disponibles');
            contenedor.innerHTML = snapshot.empty ? '<p>No hay pedidos pendientes...</p>' : '';
            snapshot.forEach(doc => {
                const p = doc.data();
                contenedor.innerHTML += `
                    <div class="card-pedido" style="border-left-color:var(--orange)">
                        <strong>NUEVA SOLICITUD</strong>
                        <p>📦 ${p.descripcion}</p>
                        <p>💰 Pago: ${p.monto}</p>
                        <button class="btn btn-ok" style="padding:8px; font-size:12px; background:var(--green)">ACEPTAR VIAJE</button>
                    </div>
                `;
            });
        });
    }

    window.enviarPedidoFinal = async () => {
        try {
            await addDoc(collection(db, "pedidos"), {
                clienteId: auth.currentUser.uid,
                origen: document.getElementById('c-ori').value,
                destino: document.getElementById('c-des').value,
                descripcion: "Paquete pequeño",
                estado: "buscando",
                monto: "$65.00 MXN",
                fecha: serverTimestamp()
            });
            alert("Pedido enviado");
        } catch (e) { alert("Error al solicitar"); }
    };

    window.ir = (id) => {
        document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
        document.getElementById(id).classList.add('on');
    };

    window.cerrarSesion = () => signOut(auth).then(() => location.reload());
</script>
</body>
</html>
