<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnvíaYa — Aguascalientes Premium</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --navy: #0A3D91; --orange: #FF7A00; --green: #2ecc71; --bg: #F3F4F6; --white: #FFFFFF; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; color: #333; overflow-x: hidden; }

        .scr { display: none; min-height: 100vh; flex-direction: column; }
        .scr.on { display: flex; }

        #map-wrapper { width: 100%; height: 35vh; position: relative; background: #e0e0e0; z-index: 1; border-bottom: 3px solid var(--navy); }
        #map { height: 100%; width: 100%; }

        .content { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; box-sizing: border-box; font-family: inherit; outline: none; }
        
        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; transition: 0.3s; }
        .btn-ok { background: var(--navy); color: white; }
        .btn-gps { background: var(--orange); color: white; font-size: 13px; margin-bottom: 5px; }

        .card-pedido { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 10px; border-left: 5px solid var(--navy); }
        .status-tag { font-size: 10px; padding: 4px 8px; border-radius: 20px; font-weight: 800; text-transform: uppercase; background: #ffeaa7; color: #d6a000; }

        .login-header { text-align: center; padding: 40px 20px; }
        .login-header h1 { color: var(--navy); font-weight: 800; margin: 0; font-size: 32px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="s-login" class="scr on">
    <div class="login-header"><h1>EnvíaYa</h1><p>LOGÍSTICA PREMIUM</p></div>
    <div class="content">
        <input type="email" id="log-email" placeholder="Correo" class="input">
        <input type="password" id="log-pass" placeholder="Contraseña" class="input">
        <button class="btn btn-ok" id="btn-login" onclick="doLogin()">ENTRAR</button>
        <p style="text-align:center;">¿No tienes cuenta? <a href="#" onclick="ir('s-reg')" style="color:var(--orange); font-weight:bold; text-decoration:none;">Regístrate aquí</a></p>
    </div>
</div>

<div id="s-reg" class="scr">
    <div class="content">
        <h2 style="color:var(--navy)">Crea tu cuenta</h2>
        <input type="text" id="reg-nom" placeholder="Nombre completo" class="input">
        <input type="email" id="reg-email" placeholder="Correo electrónico" class="input">
        <input type="password" id="reg-pass" placeholder="Contraseña" class="input">
        <select id="reg-rol" class="input">
            <option value="cliente">Soy Cliente</option>
            <option value="conductor">Soy Conductor</option>
        </select>
        <button class="btn btn-ok" onclick="doRegister()">FINALIZAR REGISTRO</button>
        <button class="btn" onclick="ir('s-login')" style="background:none; color:var(--navy)">Volver</button>
    </div>
</div>

<div id="s-cliente" class="scr">
    <div id="map-wrapper"><div id="map"></div></div>
    <div class="content">
        <button class="btn btn-gps" onclick="obtenerUbicacionActual()">📍 USAR MI UBICACIÓN ACTUAL</button>
        <input type="text" id="c-ori" placeholder="Origen (Toca el mapa)" class="input" readonly>
        <input type="text" id="c-des" placeholder="Destino (Toca el mapa)" class="input" readonly>
        
        <div id="panel-resumen" class="hidden">
            <div style="background:#E5EBF5; padding:10px; border-radius:10px; text-align:center; margin:10px 0;">
                <b id="val-precio">$0.00 MXN</b><br><small id="val-dist">0 km</small>
            </div>
            <input type="text" id="p-desc" placeholder="¿Qué enviamos?" class="input">
            <button class="btn btn-ok" id="btn-envio" onclick="enviarPedidoFinal()">SOLICITAR ENVÍO</button>
        </div>

        <h3 style="margin-top:20px; font-size:16px;">Mis Pedidos Recientes</h3>
        <div id="lista-historial"></div>
        <button onclick="cerrarSesion()" style="color:red; border:none; background:none; padding:20px; cursor:pointer;">Cerrar Sesión</button>
    </div>
</div>

<div id="s-conductor" class="scr">
    <div class="content">
        <h2 style="color:var(--navy)">Pedidos Disponibles</h2>
        <div id="pedidos-disponibles"></div>
        <button onclick="cerrarSesion()" style="color:red; border:none; background:none; padding:20px; cursor:pointer;">Cerrar Sesión</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC-X3BN11rTG66DWe3njD81zZh_oy5p2hY",
        authDomain: "enviaya-d8f34.firebaseapp.com",
        projectId: "enviaya-d8f34",
        storageBucket: "enviaya-d8f34.firebasestorage.app",
        messagingSenderId: "491320152351",
        appId: "1:491320152351:web:9bde727d7edaf2d5f3e02a"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let MAP, markerOri, markerDes, rutaLine;
    let latOri, lngOri, latDes, lngDes;
    let seleccionandoOrigen = true;

    window.ir = (id) => {
        document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
        document.getElementById(id).classList.add('on');
        if (id === 's-cliente') setTimeout(initMap, 500);
    };

    // --- MEJORA: LOGIN REFORZADO ---
    window.doLogin = async () => {
        const email = document.getElementById('log-email').value;
        const pass = document.getElementById('log-pass').value;
        const btn = document.getElementById('btn-login');
        
        if(!email || !pass) return alert("Completa todos los campos");
        
        btn.innerText = "VERIFICANDO...";
        btn.disabled = true;

        try {
            const res = await signInWithEmailAndPassword(auth, email, pass);
            // Buscamos el perfil en Firestore inmediatamente después de loguear
            const userDoc = await getDoc(doc(db, "usuarios", res.user.uid));
            
            if (userDoc.exists()) {
                const tipo = userDoc.data().tipo;
                console.log("Usuario logueado con tipo:", tipo);
                
                if (tipo === "conductor") {
                    ir('s-conductor');
                    cargarPedidosConductor();
                } else {
                    ir('s-cliente');
                    cargarHistorialCliente(res.user.uid);
                }
            } else {
                alert("Tu usuario no tiene un perfil configurado en Firestore. Contacta a soporte.");
                await signOut(auth);
            }
        } catch (e) { 
            console.error(e);
            alert("Error de acceso: " + e.message); 
        } finally {
            btn.innerText = "ENTRAR";
            btn.disabled = false;
        }
    };

    window.doRegister = async () => {
        const nom = document.getElementById('reg-nom').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-pass').value;
        const rol = document.getElementById('reg-rol').value;
        try {
            const res = await createUserWithEmailAndPassword(auth, email, pass);
            await setDoc(doc(db, "usuarios", res.user.uid), { nombre: nom, tipo: rol, email: email });
            alert("¡Registro exitoso!");
            location.reload();
        } catch (e) { alert("Error en el registro: " + e.message); }
    };

    // --- LÓGICA DE MAPA ---
    function initMap() {
        if (MAP) { 
            setTimeout(() => MAP.invalidateSize(), 200); 
            return; 
        }
        MAP = L.map('map', { zoomControl: false }).setView([21.8853, -102.2916], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(MAP);
        MAP.on('click', (e) => fijarPunto(e.latlng.lat, e.latlng.lng));
    }

    async function fijarPunto(lat, lng) {
        if (seleccionandoOrigen) {
            if (markerOri) MAP.removeLayer(markerOri);
            if (rutaLine) MAP.removeLayer(rutaLine);
            markerOri = L.marker([lat, lng]).addTo(MAP);
            latOri = lat; lngOri = lng;
            seleccionandoOrigen = false;
            document.getElementById('c-ori').value = "Origen fijado";
        } else {
            if (markerDes) MAP.removeLayer(markerDes);
            markerDes = L.marker([lat, lng]).addTo(MAP);
            latDes = lat; lngDes = lng;
            seleccionandoOrigen = true;
            document.getElementById('c-des').value = "Destino fijado";
            trazarRuta();
        }
    }

    async function trazarRuta() {
        try {
            const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${lngOri},${latOri};${lngDes},${latDes}?overview=full&geometries=geojson`);
            const data = await res.json();
            const dist = (data.routes[0].distance / 1000).toFixed(2);
            const costo = Math.max(50, dist * 11);
            
            if (rutaLine) MAP.removeLayer(rutaLine);
            const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
            rutaLine = L.polyline(coords, { color: '#0A3D91', weight: 5 }).addTo(MAP);
            MAP.fitBounds(rutaLine.getBounds());
            
            document.getElementById('val-precio').innerText = `$${costo.toFixed(2)} MXN`;
            document.getElementById('val-dist').innerText = `${dist} km`;
            document.getElementById('panel-resumen').classList.remove('hidden');
        } catch(e) { console.log("Error al trazar ruta"); }
    }

    window.enviarPedidoFinal = async () => {
        const btn = document.getElementById('btn-envio');
        btn.disabled = true;
        btn.innerText = "ENVIANDO...";

        try {
            await addDoc(collection(db, "pedidos"), {
                clienteId: auth.currentUser.uid,
                origen: document.getElementById('c-ori').value,
                destino: document.getElementById('c-des').value,
                monto: document.getElementById('val-precio').innerText,
                descripcion: document.getElementById('p-desc').value || "Paquete",
                estado: "buscando",
                fecha: serverTimestamp()
            });
            alert("¡Pedido enviado!");
            reiniciarFormularioCliente(); 
        } catch (e) { alert("Error al conectar con Firebase."); }
        finally {
            btn.disabled = false;
            btn.innerText = "SOLICITAR ENVÍO";
        }
    };

    function reiniciarFormularioCliente() {
        document.getElementById('c-ori').value = "";
        document.getElementById('c-des').value = "";
        document.getElementById('p-desc').value = "";
        document.getElementById('panel-resumen').classList.add('hidden');
        if (markerOri) MAP.removeLayer(markerOri);
        if (markerDes) MAP.removeLayer(markerDes);
        if (rutaLine) MAP.removeLayer(rutaLine);
        seleccionandoOrigen = true;
        setTimeout(() => { MAP.invalidateSize(); }, 200);
    }

    function cargarHistorialCliente(uid) {
        const q = query(collection(db, "pedidos"), where("clienteId", "==", uid));
        onSnapshot(q, (snap) => {
            const div = document.getElementById('lista-historial');
            div.innerHTML = '';
            snap.forEach(doc => {
                const p = doc.data();
                div.innerHTML += `<div class="card-pedido">
                    <b>${p.descripcion}</b> <span class="status-tag">${p.estado}</span><br>
                    <small>${p.monto}</small>
                </div>`;
            });
        });
    }

    function cargarPedidosConductor() {
        const q = query(collection(db, "pedidos"), where("estado", "==", "buscando"));
        onSnapshot(q, (snap) => {
            const div = document.getElementById('pedidos-disponibles');
            div.innerHTML = snap.empty ? '<p>No hay pedidos cerca...</p>' : '';
            snap.forEach(doc => {
                const p = doc.data();
                div.innerHTML += `<div class="card-pedido" style="border-left-color:var(--orange)">
                    <b>NUEVO ENVÍO: ${p.monto}</b><br>
                    <small>${p.descripcion}</small><br>
                    <button class="btn btn-ok" style="padding:5px; margin-top:5px;">ACEPTAR</button>
                </div>`;
            });
        });
    }

    window.obtenerUbicacionActual = () => {
        navigator.geolocation.getCurrentPosition((pos) => {
            fijarPunto(pos.coords.latitude, pos.coords.longitude);
            MAP.setView([pos.coords.latitude, pos.coords.longitude], 16);
        });
    };

    window.cerrarSesion = () => signOut(auth).then(() => location.reload());
</script>
</body>
</html>
