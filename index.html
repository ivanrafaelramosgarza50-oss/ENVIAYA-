<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EnvíaYa — Aguascalientes</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root { --navy: #0A3D91; --orange: #FF7A00; --bg: #F3F4F6; --white: #FFFFFF; }
body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; }

.scr { display: none; min-height: 100vh; flex-direction: column; }
.scr.on { display: flex; }

/* Corrección Mapa: Altura fija y visualización */
#map-container { width: 100%; height: 300px; position: relative; background: #ddd; z-index: 1; }
#map { height: 100%; width: 100%; }

.content { padding: 20px; display: flex; flex-direction: column; gap: 15px; } /* Espaciado justificado */

.input-group { position: relative; width: 100%; }
.input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
.btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; font-family: inherit; }
.btn-ok { background: var(--navy); color: white; }
.btn-warn { background: var(--orange); color: white; }
.btn-disabled { background: #ccc; color: #888; cursor: not-allowed; }

.box-costo { background: #e8f0fe; border-left: 5px solid var(--navy); padding: 15px; border-radius: 8px; text-align: center; }
.sugerencias { position: absolute; background: white; width: 100%; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 0 0 10px 10px; max-height: 150px; overflow-y: auto; }
.sug-item { padding: 10px; font-size: 12px; border-bottom: 1px solid #eee; cursor: pointer; }

.hidden { display: none !important; }
</style>
</head>
<body>

<div id="s-cliente" class="scr on">
    <div id="map-container"><div id="map"></div></div>
    
    <div class="content">
        <button class="btn btn-warn" onclick="obtenerUbicacionActual()">📍 USAR MI UBICACIÓN ACTUAL</button>

        <div class="input-group">
            <input type="text" id="c-ori" placeholder="Dirección de Origen" class="input" oninput="buscarDireccion(this, 'sug-ori')">
            <div id="sug-ori" class="sugerencias"></div>
        </div>
        <input type="text" id="c-ref-ori" placeholder="Referencia Origen (Ejem: Casa de 2 pisos)" class="input">

        <div class="input-group">
            <input type="text" id="c-des" placeholder="Dirección de Destino" class="input" oninput="buscarDireccion(this, 'sug-des')">
            <div id="sug-des" class="sugerencias"></div>
        </div>
        <input type="text" id="c-ref-des" placeholder="Referencia Destino (Ejem: En la tienda)" class="input">

        <button class="btn btn-ok" onclick="cotizar()" id="btn-cotizar">COTIZAR ENVÍO</button>

        <div id="sec-confirmar" class="hidden" style="display:flex; flex-direction:column; gap:15px;">
            <div class="box-costo">
                <div style="font-size:12px; color:var(--navy);">COSTO DE ENVÍO</div>
                <div id="txt-precio" style="font-size:24px; font-weight:800;">$0.00</div>
                <div id="txt-dist" style="font-size:11px;">0.0 km</div>
            </div>

            <textarea id="p-desc" placeholder="Descripción del paquete (OBLIGATORIO: Ej. Pastel de fresa, documentos...)" class="input" style="height:80px; resize:none;"></textarea>
            
            <label style="font-size:12px; display:flex; gap:10px; align-items:center;">
                <input type="checkbox" id="chk-seg"> Acepto que mi envío no infringe políticas.
            </label>

            <button class="btn btn-ok" id="btn-solicitar" onclick="solicitarServicio()">SOLICITAR SERVICIO</button>
        </div>

        <button onclick="location.reload()" style="background:none; border:none; color:red; font-size:14px; cursor:pointer;">Cerrar Sesión</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = { 
apiKey:            "AIzaSyC-X3BN11rTG66DWe3njD81zZh_oy5p2hY",
  authDomain:        "enviaya-d8f34.firebaseapp.com",
  projectId:         "enviaya-d8f34",
  storageBucket:     "enviaya-d8f34.firebasestorage.app",
  messagingSenderId: "491320152351",
  appId:             "1:491320152351:web:9bde727d7edaf2d5f3e02a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let MAP, markerOri, markerDes, rutaLine, distFinal = 0, costoFinal = 0;

function initMap() {
    if (MAP) return;
    MAP = L.map('map', { zoomControl: false }).setView([21.8853, -102.2916], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(MAP);

    // Permitir selección táctil/clic
    MAP.on('click', (e) => {
        const tipo = confirm("¿Marcar este punto como ORIGEN?") ? 'ori' : 'des';
        fijarPunto(e.latlng.lat, e.latlng.lng, tipo);
    });

    // Forzar renderizado si el contenedor estaba oculto
    setTimeout(() => { MAP.invalidateSize(); }, 400);
}

async function fijarPunto(lat, lng, tipo) {
    if (tipo === 'ori') {
        if (markerOri) MAP.removeLayer(markerOri);
        markerOri = L.marker([lat, lng]).addTo(MAP).bindPopup("Origen");
    } else {
        if (markerDes) MAP.removeLayer(markerDes);
        markerDes = L.marker([lat, lng]).addTo(MAP).bindPopup("Destino");
    }
    
    // Obtener dirección textual para el cuadro
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
    const data = await res.json();
    document.getElementById(tipo === 'ori' ? 'c-ori' : 'c-des').value = data.display_name;
    limpiarCotizacion();
}

window.buscarDireccion = async (input, idLista) => {
    const query = input.value;
    const lista = document.getElementById(idLista);
    if (query.length < 4) { lista.innerHTML = ''; return; }

    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}, Aguascalientes&limit=4`);
    const data = await res.json();
    
    lista.innerHTML = '';
    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'sug-item';
        div.innerText = item.display_name;
        div.onclick = () => {
            input.value = item.display_name;
            fijarPunto(parseFloat(item.lat), parseFloat(item.lon), idLista === 'sug-ori' ? 'ori' : 'des');
            lista.innerHTML = '';
        };
        lista.appendChild(div);
    });
};

window.cotizar = () => {
    if (!markerOri || !markerDes) return alert("Selecciona origen y destino en el mapa o escribiendo.");
    
    const p1 = markerOri.getLatLng();
    const p2 = markerDes.getLatLng();
    
    if (rutaLine) MAP.removeLayer(rutaLine);
    rutaLine = L.polyline([p1, p2], { color: '#0A3D91', weight: 4, dashArray: '5, 10' }).addTo(MAP);
    MAP.fitBounds(rutaLine.getBounds(), { padding: [30, 30] });

    distFinal = (p1.distanceTo(p2) / 1000).toFixed(2);
    costoFinal = Math.max(50, distFinal * 11);

    document.getElementById('txt-precio').innerText = `$${costoFinal.toFixed(2)} MXN`;
    document.getElementById('txt-dist').innerText = `Distancia: ${distFinal} km`;
    document.getElementById('sec-confirmar').classList.remove('hidden');
    document.getElementById('btn-cotizar').classList.add('hidden');
};

function limpiarCotizacion() {
    document.getElementById('sec-confirmar').classList.add('hidden');
    document.getElementById('btn-cotizar').classList.remove('hidden');
}

window.solicitarServicio = async () => {
    const desc = document.getElementById('p-desc').value;
    const chk = document.getElementById('chk-seg').checked;

    if (!desc.trim()) return alert("Por favor describe qué vas a enviar.");
    if (!chk) return alert("Debes aceptar las políticas de seguridad.");

    try {
        await addDoc(collection(db, "pedidos"), {
            descripcion: desc,
            costo: costoFinal,
            distancia: distFinal,
            estado: "buscando",
            creado_en: serverTimestamp()
        });
        alert("¡Pedido solicitado con éxito!");
    } catch (e) { alert("Error al conectar con la base de datos."); }
};

window.obtenerUbicacionActual = () => {
    navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        MAP.setView([latitude, longitude], 15);
        fijarPunto(latitude, longitude, 'ori');
    });
};

// Iniciar mapa al cargar
window.onload = initMap;
</script>
</body>
</html>
