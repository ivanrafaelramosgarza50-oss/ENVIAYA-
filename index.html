<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnvíaYa — Aguascalientes</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --navy: #0A3D91; --orange: #FF7A00; --bg: #F3F4F6; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; padding: 0; }
        #map-wrapper { width: 100%; height: 40vh; min-height: 300px; background: #ccc; border-bottom: 3px solid var(--navy); }
        #map { height: 100%; width: 100%; }
        .content { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .input-group { position: relative; }
        .input { width: 100%; padding: 14px; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; outline: none; }
        .sugerencias { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #ddd; z-index: 999; border-radius: 0 0 10px 10px; display: none; max-height: 150px; overflow-y: auto; }
        .sug-item { padding: 10px; font-size: 13px; border-bottom: 1px solid #eee; cursor: pointer; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; }
        .btn-ok { background: var(--navy); color: white; }
        .btn-gps { background: var(--orange); color: white; }
        .box-cotiza { background: #E5EBF5; padding: 15px; border-radius: 12px; text-align: center; border-left: 5px solid var(--orange); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="app">
    <div id="map-wrapper"><div id="map"></div></div>
    <div class="content">
        <button class="btn btn-gps" id="btn-gps" onclick="usarGPS()">📍 FIJAR ORIGEN CON GPS</button>

        <div class="input-group">
            <input type="text" id="c-ori" placeholder="Punto A: Origen" class="input" oninput="buscar(this, 'sug-ori')">
            <div id="sug-ori" class="sugerencias"></div>
        </div>
        <div class="input-group">
            <input type="text" id="c-des" placeholder="Punto B: Destino" class="input" oninput="buscar(this, 'sug-des')">
            <div id="sug-des" class="sugerencias"></div>
        </div>

        <div id="resumen" class="hidden">
            <div class="box-cotiza">
                <div style="font-size:22px; font-weight:800; color:var(--navy)" id="txt-precio">$0.00</div>
                <div style="font-size:12px" id="txt-dist">0 km</div>
            </div>
            <button class="btn btn-ok" style="margin-top:10px" onclick="enviar()">SOLICITAR SERVICIO</button>
        </div>

        <button onclick="limpiar()" style="background:none; border:none; color:var(--navy); font-size:12px; margin-top:10px; cursor:pointer;">Limpiar puntos</button>
        <button onclick="salir()" style="background:none; border:none; color:red; font-size:12px; margin-top:20px; cursor:pointer;">❌ CERRAR SESIÓN</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey:            "AIzaSyC-X3BN11rTG66DWe3njD81zZh_oy5p2hY",
  authDomain:        "enviaya-d8f34.firebaseapp.com",
  projectId:         "enviaya-d8f34",
  storageBucket:     "enviaya-d8f34.firebasestorage.app",
  messagingSenderId: "491320152351",
  appId:             "1:491320152351:web:9bde727d7edaf2d5f3e02a"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Variables globales
    let MAP, markerOri, markerDes, ruta;
    let latO, lngO, latD, lngD;
    let esOrigen = true;

    // Inicializar mapa
    window.onload = () => {
        MAP = L.map('map', { zoomControl: false }).setView([21.8853, -102.2916], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(MAP);
        MAP.on('click', (e) => colocar(e.latlng.lat, e.latlng.lng));
        setTimeout(() => MAP.invalidateSize(), 500);
    };

    // Lógica de marcado
    window.colocar = async (lat, lng, manual = false) => {
        const iconA = L.divIcon({className:'', html:`<div style="background:#2ecc71; width:20px; height:20px; border-radius:50%; border:2px solid white;"></div>`});
        const iconB = L.divIcon({className:'', html:`<div style="background:#FF7A00; width:20px; height:20px; border-radius:50%; border:2px solid white;"></div>`});

        if (esOrigen) {
            if (markerOri) MAP.removeLayer(markerOri);
            if (ruta) MAP.removeLayer(ruta);
            markerOri = L.marker([lat, lng], {icon: iconA}).addTo(MAP);
            latO = lat; lngO = lng;
            esOrigen = false;
            document.getElementById('btn-gps').innerText = "🏁 FIJAR DESTINO CON GPS";
            if(!manual) await obtenerDir(lat, lng, 'c-ori');
        } else {
            if (markerDes) MAP.removeLayer(markerDes);
            markerDes = L.marker([lat, lng], {icon: iconB}).addTo(MAP);
            latD = lat; lngD = lng;
            esOrigen = true;
            document.getElementById('btn-gps').innerText = "📍 FIJAR ORIGEN CON GPS";
            if(!manual) await obtenerDir(lat, lng, 'c-des');
            calcular();
        }
    };

    window.buscar = async (el, idLista) => {
        const lista = document.getElementById(idLista);
        if (el.value.length < 4) { lista.style.display = 'none'; return; }
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${el.value}, Aguascalientes&limit=4`);
        const data = await r.json();
        lista.innerHTML = '';
        lista.style.display = 'block';
        data.forEach(i => {
            const d = document.createElement('div');
            d.className = 'sug-item';
            d.innerText = i.display_name.split(',').slice(0,3).join(',');
            d.onclick = () => {
                el.value = d.innerText;
                lista.style.display = 'none';
                window.colocar(parseFloat(i.lat), parseFloat(i.lon), true);
            };
            lista.appendChild(d);
        });
    };

    async function obtenerDir(lat, lng, id) {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
        const d = await r.json();
        document.getElementById(id).value = d.display_name.split(',').slice(0,3).join(',');
    }

    async function calcular() {
        const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${lngO},${latO};${lngD},${latD}?overview=full&geometries=geojson`);
        const d = await r.json();
        const dist = (d.routes[0].distance / 1000).toFixed(2);
        const precio = Math.max(50, dist * 11);
        
        if (ruta) MAP.removeLayer(ruta);
        ruta = L.polyline(d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), {color: '#0A3D91'}).addTo(MAP);
        MAP.fitBounds(ruta.getBounds());

        document.getElementById('txt-precio').innerText = `$${precio.toFixed(2)} MXN`;
        document.getElementById('txt-dist').innerText = `Distancia: ${dist} km`;
        document.getElementById('resumen').classList.remove('hidden');
    }

    window.enviar = async () => {
        try {
            await addDoc(collection(db, "pedidos"), {
                ori: document.getElementById('c-ori').value,
                des: document.getElementById('c-des').value,
                precio: document.getElementById('txt-precio').innerText,
                time: serverTimestamp()
            });
            alert("Pedido enviado");
            window.limpiar();
        } catch (e) {
            alert("Error de conexión (Firebase). Verifica tus permisos.");
            // Aun con error, permitimos que el usuario intente de nuevo sin bloquear el mapa
            esOrigen = true; 
        }
    };

    window.limpiar = () => {
        location.reload(); // La forma más segura de resetear todo el estado
    };

    window.salir = () => {
        if(confirm("¿Cerrar sesión?")) {
            sessionStorage.clear();
            localStorage.clear();
            window.location.href = "index.html";
        }
    };

    window.usarGPS = () => {
        navigator.geolocation.getCurrentPosition(p => window.colocar(p.coords.latitude, p.coords.longitude));
    };
</script>
</body>
</html>
