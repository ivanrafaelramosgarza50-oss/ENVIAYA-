<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EnvíaYa — Aguascalientes</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root { --navy: #0A3D91; --orange: #FF7A00; --bg: #F3F4F6; --white: #FFFFFF; }
body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; padding: 0; overflow-x: hidden; }

/* Corrección de visibilidad del Mapa */
#map-wrapper { width: 100%; height: 45vh; min-height: 300px; position: relative; background: #e0e0e0; border-bottom: 2px solid #ddd; z-index: 1; }
#map { height: 100%; width: 100%; }

.content { padding: 15px; display: flex; flex-direction: column; gap: 12px; }

.input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
.btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-family: inherit; transition: 0.2s; }
.btn-ok { background: var(--navy); color: white; }
.btn-gps { background: var(--orange); color: white; margin-bottom: 5px; }

.sugerencias { background: white; position: absolute; width: 90%; z-index: 1000; box-shadow: 0 5px 10px rgba(0,0,0,0.1); border-radius: 0 0 10px 10px; }
.sug-item { padding: 12px; border-bottom: 1px solid #eee; font-size: 13px; cursor: pointer; }

.box-cotiza { background: #E5EBF5; padding: 15px; border-radius: 12px; text-align: center; border-left: 5px solid var(--orange); }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="s-cliente" class="scr">
    <div id="map-wrapper"><div id="map"></div></div>
    
    <div class="content">
        <button class="btn btn-gps" onclick="obtenerUbicacionActual()">📍 USAR MI UBICACIÓN ACTUAL</button>

        <div style="position:relative;">
            <input type="text" id="c-ori" placeholder="Dirección de Origen" class="input" oninput="buscarDireccion(this, 'sug-ori')">
            <div id="sug-ori" class="sugerencias"></div>
        </div>
        <input type="text" id="c-ref-ori" placeholder="Referencia Origen (Casa, local, etc)" class="input">

        <div style="position:relative;">
            <input type="text" id="c-des" placeholder="Dirección de Destino" class="input" oninput="buscarDireccion(this, 'sug-des')">
            <div id="sug-des" class="sugerencias"></div>
        </div>
        <input type="text" id="c-ref-des" placeholder="Referencia Destino (Piso, oficina, etc)" class="input">

        <button class="btn btn-ok" id="btn-cotiza" onclick="cotizarServicio()">COTIZAR ENVÍO</button>

        <div id="panel-resumen" class="hidden">
            <div class="box-cotiza">
                <div style="font-weight:800; color:var(--navy); font-size:22px;" id="val-precio">$0.00</div>
                <div style="font-size:11px;" id="val-dist">0 km</div>
            </div>
            <textarea id="p-desc" placeholder="¿Qué enviamos? (Ej: 2 Hamburguesas)" class="input" style="margin-top:10px; height:60px;"></textarea>
            <label style="font-size:11px; display:flex; gap:8px; margin: 10px 0;">
                <input type="checkbox" id="chk-pol"> Confirmo que el envío es legal y seguro.
            </label>
            <button class="btn btn-ok" onclick="enviarPedidoFinal()">SOLICITAR SERVICIO</button>
        </div>

        <button onclick="location.reload()" style="background:none; border:none; color:red; font-size:13px; margin-top:10px;">Cerrar Sesión</button>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
apiKey:            "AIzaSyC-X3BN11rTG66DWe3njD81zZh_oy5p2hY",
  authDomain:        "enviaya-d8f34.firebaseapp.com",
  projectId:         "enviaya-d8f34",
  storageBucket:     "enviaya-d8f34.firebasestorage.app",
  messagingSenderId: "491320152351",
  appId:             "1:491320152351:web:9bde727d7edaf2d5f3e02a"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let MAP, markerOri, markerDes, rutaLine;
let latOri, lngOri, latDes, lngDes;

// 1. Inicializar el mapa garantizando visibilidad
function initMap() {
    if (MAP) return;
    MAP = L.map('map', { zoomControl: false }).setView([21.8853, -102.2916], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(MAP);
    
    MAP.on('click', (e) => {
        const tipo = confirm("¿Es el punto de ORIGEN?") ? 'ori' : 'des';
        fijarCoordenadas(e.latlng.lat, e.latlng.lng, tipo);
    });

    // Truco para móviles: forzar refresco de tamaño
    setTimeout(() => { MAP.invalidateSize(); }, 500);
}

// 2. Fijar puntos y buscar dirección inversa
async function fijarCoordenadas(lat, lng, tipo) {
    if (tipo === 'ori') {
        latOri = lat; lngOri = lng;
        if (markerOri) MAP.removeLayer(markerOri);
        markerOri = L.marker([lat, lng]).addTo(MAP).bindPopup("Origen").openPopup();
    } else {
        latDes = lat; lngDes = lng;
        if (markerDes) MAP.removeLayer(markerDes);
        markerDes = L.marker([lat, lng]).addTo(MAP).bindPopup("Destino").openPopup();
    }

    try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
        const data = await res.json();
        document.getElementById(tipo === 'ori' ? 'c-ori' : 'c-des').value = data.display_name;
    } catch(e) { console.log("Error en geocodificación"); }
}

// 3. Autocompletado manual
window.buscarDireccion = async (input, idLista) => {
    const query = input.value;
    const lista = document.getElementById(idLista);
    if (query.length < 5) { lista.innerHTML = ''; return; }

    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}, Aguascalientes&limit=3`);
    const data = await res.json();
    
    lista.innerHTML = '';
    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'sug-item';
        div.innerText = item.display_name;
        div.onclick = () => {
            input.value = item.display_name;
            fijarCoordenadas(parseFloat(item.lat), parseFloat(item.lon), idLista === 'sug-ori' ? 'ori' : 'des');
            lista.innerHTML = '';
        };
        lista.appendChild(div);
    });
};

// 4. Ubicación Actual (Corregido)
window.obtenerUbicacionActual = () => {
    if (!navigator.geolocation) return alert("Tu navegador no soporta GPS.");
    
    navigator.geolocation.getCurrentPosition(
        (pos) => {
            const { latitude, longitude } = pos.coords;
            MAP.setView([latitude, longitude], 16);
            fijarCoordenadas(latitude, longitude, 'ori');
        },
        (err) => { alert("Por favor activa el GPS de tu celular."); },
        { enableHighAccuracy: true }
    );
};

// 5. Cotización (Lógica que pediste)
window.cotizarServicio = () => {
    if (!latOri || !latDes) {
        return alert("Selecciona origen y destino en el mapa o escribiendo.");
    }

    const p1 = L.latLng(latOri, lngOri);
    const p2 = L.latLng(latDes, lngDes);
    
    if (rutaLine) MAP.removeLayer(rutaLine);
    rutaLine = L.polyline([p1, p2], { color: '#0A3D91', weight: 4, dashArray: '5, 10' }).addTo(MAP);
    MAP.fitBounds(rutaLine.getBounds(), { padding: [40, 40] });

    const dist = (p1.distanceTo(p2) / 1000).toFixed(2);
    const precio = Math.max(50, dist * 11);

    document.getElementById('val-precio').innerText = `$${precio.toFixed(2)} MXN`;
    document.getElementById('val-dist').innerText = `Distancia: ${dist} km`;
    
    document.getElementById('panel-resumen').classList.remove('hidden');
    document.getElementById('btn-cotiza').classList.add('hidden');
};

window.enviarPedidoFinal = async () => {
    const desc = document.getElementById('p-desc').value;
    const chk = document.getElementById('chk-pol').checked;

    if (!desc.trim()) return alert("Describe qué vas a enviar.");
    if (!chk) return alert("Debes aceptar las políticas.");

    try {
        await addDoc(collection(db, "pedidos"), {
            descripcion: desc,
            estado: "buscando",
            creado_en: serverTimestamp()
        });
        alert("¡Pedido enviado! Buscando repartidor...");
    } catch(e) { alert("Error al guardar en base de datos."); }
};

// Carga inicial
window.onload = initMap;
</script>
</body>
</html>
