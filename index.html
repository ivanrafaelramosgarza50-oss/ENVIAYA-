<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EnvíaYa — Aguascalientes</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root { --navy: #0A3D91; --orange: #FF7A00; --bg: #F3F4F6; --white: #FFFFFF; --dark: #1F2937; }
body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; color: var(--dark); min-height: 100vh; }

/* Sistema de Pantallas */
.scr { display: none; flex-direction: column; min-height: 100vh; width: 100%; box-sizing: border-box; }
.scr.on { display: flex; animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Formularios */
.content-pad { padding: 20px; }
.input-group { position: relative; margin-bottom: 12px; }
.input { width: 100%; padding: 14px; border: 1px solid #ccc; border-radius: 10px; font-size: 14px; box-sizing: border-box; font-family: inherit; }
.btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; }
.btn-ok { background: var(--navy); color: white; }
.btn-gps { background: var(--orange); color: white; margin-bottom: 15px; font-size: 12px; }

/* Mapa y Sugerencias */
#map { height: 350px; width: 100%; background: #e0e0e0; z-index: 1; }
.sugerencias { 
    position: absolute; top: 100%; left: 0; width: 100%; 
    background: white; border: 1px solid #ddd; z-index: 1000; 
    border-radius: 0 0 10px 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    max-height: 200px; overflow-y: auto; display: none;
}
.sugerencia-item { padding: 10px; font-size: 12px; border-bottom: 1px solid #eee; cursor: pointer; }
.sugerencia-item:hover { background: #f0f0f0; }

.box-costo { background: #E5EBF5; padding: 15px; border-radius: 15px; border-left: 5px solid var(--orange); margin: 15px 0; text-align: center; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div id="s-login" class="scr on">
    <div class="content-pad" style="text-align:center; margin-top:50px;">
        <h1 style="color:var(--navy); font-weight:800; font-size:38px; margin:0;">EnvíaYa</h1>
        <p style="color:var(--orange); font-weight:600; font-size:12px; letter-spacing:3px;">AGUASCALIENTES</p>
        <div style="margin-top:40px;">
            <input type="email" id="log-email" placeholder="Correo electrónico" class="input">
            <input type="password" id="log-pass" placeholder="Contraseña" class="input">
            <button class="btn btn-ok" onclick="doLogin()">ENTRAR</button>
            <p style="font-size:14px; margin-top:20px;">¿Nuevo aquí? <a href="javascript:ir('s-reg')" style="color:var(--orange); font-weight:bold; text-decoration:none;">Regístrate</a></p>
        </div>
    </div>
</div>

<div id="s-reg" class="scr">
    <div class="content-pad">
        <h2 style="color:var(--navy);">Crear Perfil</h2>
        <input type="text" id="reg-nom" placeholder="Nombre completo" class="input">
        <input type="email" id="reg-email" placeholder="Correo electrónico" class="input">
        <input type="password" id="reg-pass" placeholder="Contraseña" class="input">
        <select id="reg-rol" class="input" onchange="document.getElementById('sec-v').classList.toggle('hidden', this.value !== 'conductor')">
            <option value="cliente">Soy Cliente</option>
            <option value="conductor">Soy Conductor</option>
        </select>
        <div id="sec-v" class="hidden">
            <input type="text" id="reg-v-placas" placeholder="Placas del vehículo" class="input">
        </div>
        <button class="btn btn-ok" onclick="doRegister()">FINALIZAR</button>
        <button class="btn" onclick="ir('s-login')" style="background:none; color:var(--navy);">Volver</button>
    </div>
</div>

<div id="s-cliente" class="scr">
    <div id="map"></div>
    
    <div class="content-pad">
        <button class="btn btn-gps" onclick="obtenerUbicacionActual()">📍 USAR MI UBICACIÓN ACTUAL</button>

        <div class="input-group">
            <input type="text" id="c-ori" placeholder="Escribe dirección de Origen..." class="input" oninput="buscarDireccion(this, 'sug-ori')">
            <div id="sug-ori" class="sugerencias"></div>
        </div>
        <input type="text" id="c-ref-ori" placeholder="Referencia de recogida (Ejem: Casa azul)" class="input">

        <div class="input-group">
            <input type="text" id="c-des" placeholder="Escribe dirección de Destino..." class="input" oninput="buscarDireccion(this, 'sug-des')">
            <div id="sug-des" class="sugerencias"></div>
        </div>
        <input type="text" id="c-ref-des" placeholder="Referencia de entrega (Ejem: Local frente al parque)" class="input">

        <div id="box-cotizacion" class="box-costo hidden">
            <span style="font-size:11px; color:var(--navy); font-weight:bold;">PRECIO ESTIMADO</span>
            <div id="txt-precio" style="font-size:24px; font-weight:800; color:var(--navy);">$0.00</div>
            <div id="txt-dist" style="font-size:12px; color:gray;">0 km</div>
        </div>

        <label style="display:flex; gap:10px; font-size:11px; margin-bottom:15px; cursor:pointer;">
            <input type="checkbox" id="chk-seg"> Acepto que mi envío no contiene objetos prohibidos o peligrosos.
        </label>

        <button class="btn btn-ok" onclick="crearPedido()">SOLICITAR SERVICIO</button>
        <button class="btn" onclick="location.reload()" style="background:none; color:red; margin-top:10px;">Cerrar Sesión</button>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey:            "AIzaSyC-X3BN11rTG66DWe3njD81zZh_oy5p2hY",
  authDomain:        "enviaya-d8f34.firebaseapp.com",
  projectId:         "enviaya-d8f34",
  storageBucket:     "enviaya-d8f34.firebasestorage.app",
  messagingSenderId: "491320152351",
  appId:             "1:491320152351:web:9bde727d7edaf2d5f3e02a"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let MAP, markerOri, markerDes, rutaLine;
let costoFinal = 0, distKm = 0;

// Inicialización corregida del mapa
function initMap() {
    if (MAP) {
        MAP.invalidateSize();
        return;
    }
    MAP = L.map('map', { zoomControl: false }).setView([21.8853, -102.2916], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(MAP);
    
    MAP.on('click', (e) => {
        const tipo = confirm("¿Marcar como ORIGEN? (Cancelar para DESTINO)") ? 'ori' : 'des';
        actualizarPuntoManual(e.latlng.lat, e.latlng.lng, tipo);
    });
}

// Función para actualizar marcador y buscar dirección inversa
async function actualizarPuntoManual(lat, lng, tipo) {
    if (tipo === 'ori') {
        if (markerOri) MAP.removeLayer(markerOri);
        markerOri = L.marker([lat, lng], { draggable: true }).addTo(MAP).bindPopup("ORIGEN");
    } else {
        if (markerDes) MAP.removeLayer(markerDes);
        markerDes = L.marker([lat, lng], { draggable: true }).addTo(MAP).bindPopup("DESTINO");
    }
    
    // Reverse Geocoding para llenar el cuadro de texto
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
    const data = await res.json();
    document.getElementById(tipo === 'ori' ? 'c-ori' : 'c-des').value = data.display_name;
    
    calcularTarifa();
}

// Autocompletado de direcciones
window.buscarDireccion = async (input, idLista) => {
    const query = input.value;
    const lista = document.getElementById(idLista);
    if (query.length < 4) { lista.style.display = 'none'; return; }

    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${query}, Aguascalientes, Mexico&limit=5`);
    const data = await res.json();
    
    lista.innerHTML = '';
    lista.style.display = 'block';
    data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'sugerencia-item';
        div.innerText = item.display_name;
        div.onclick = () => {
            input.value = item.display_name;
            lista.style.display = 'none';
            fijarDesdeLista(item.lat, item.lon, idLista === 'sug-ori' ? 'ori' : 'des');
        };
        lista.appendChild(div);
    });
};

function fijarDesdeLista(lat, lon, tipo) {
    const coords = [parseFloat(lat), parseFloat(lon)];
    if (tipo === 'ori') {
        if (markerOri) MAP.removeLayer(markerOri);
        markerOri = L.marker(coords).addTo(MAP);
    } else {
        if (markerDes) MAP.removeLayer(markerDes);
        markerDes = L.marker(coords).addTo(MAP);
    }
    MAP.setView(coords, 15);
    calcularTarifa();
}

function calcularTarifa() {
    if (markerOri && markerDes) {
        const p1 = markerOri.getLatLng();
        const p2 = markerDes.getLatLng();
        if (rutaLine) MAP.removeLayer(rutaLine);
        rutaLine = L.polyline([p1, p2], { color: '#0A3D91', weight: 4, dashArray: '7, 7' }).addTo(MAP);
        
        distKm = (p1.distanceTo(p2) / 1000).toFixed(2);
        costoFinal = Math.max(50, distKm * 11);

        document.getElementById('box-cotizacion').classList.remove('hidden');
        document.getElementById('txt-dist').innerText = `${distKm} km de distancia`;
        document.getElementById('txt-precio').innerText = `$${costoFinal.toFixed(2)} MXN`;
    }
}

window.obtenerUbicacionActual = () => {
    navigator.geolocation.getCurrentPosition(pos => {
        const { latitude, longitude } = pos.coords;
        MAP.setView([latitude, longitude], 16);
        actualizarPuntoManual(latitude, longitude, 'ori');
    });
};

// Navegación
window.ir = (id) => {
    document.querySelectorAll('.scr').forEach(s => s.classList.remove('on'));
    document.getElementById(id).classList.add('on');
    if (id === 's-cliente') setTimeout(initMap, 500);
};

// Auth Base
window.doLogin = async () => {
    try {
        const res = await signInWithEmailAndPassword(auth, document.getElementById('log-email').value, document.getElementById('log-pass').value);
        const snap = await getDoc(doc(db, "usuarios", res.user.uid));
        if (snap.exists()) ir(snap.data().rol === 'conductor' ? 's-cond' : 's-cliente');
    } catch (e) { alert("Acceso denegado"); }
};

window.doRegister = async () => {
    const res = await createUserWithEmailAndPassword(auth, document.getElementById('reg-email').value, document.getElementById('reg-pass').value);
    await setDoc(doc(db, "usuarios", res.user.uid), { 
        nombre: document.getElementById('reg-nom').value, 
        rol: document.getElementById('reg-rol').value 
    });
    alert("¡Registrado!"); location.reload();
};
</script>
</body>
</html>
