<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EnvíaYa — Aguascalientes</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root { --navy: #0A3D91; --orange: #FF7A00; --bg: #F3F4F6; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); margin: 0; padding: 0; overflow-x: hidden; }
        #map-wrapper { width: 100%; height: 40vh; position: relative; background: #ccc; border-bottom: 2px solid var(--navy); }
        #map { height: 100%; width: 100%; }
        .content { padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .input-group { position: relative; }
        .input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; outline: none; font-family: inherit; }
        .sugerencias { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #ddd; z-index: 1000; border-radius: 0 0 8px 8px; display: none; max-height: 150px; overflow-y: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .sug-item { padding: 10px; font-size: 12px; border-bottom: 1px solid #eee; cursor: pointer; color: #444; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-family: inherit; text-transform: uppercase; }
        .btn-ok { background: var(--navy); color: white; margin-top: 5px; }
        .btn-gps { background: var(--orange); color: white; margin-bottom: 5px; font-size: 12px; }
        .box-cotiza { background: #E5EBF5; padding: 12px; border-radius: 10px; text-align: center; border-left: 4px solid var(--orange); margin: 5px 0; }
        .hidden { display: none !important; }
        .marker-label { background: white; border: 2px solid var(--navy); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

<div id="main-app">
    <div id="map-wrapper"><div id="map"></div></div>
    
    <div class="content">
        <button class="btn btn-gps" id="btn-gps" onclick="window.obtenerGPS()">📍 FIJAR ORIGEN CON GPS</button>

        <div class="input-group">
            <input type="text" id="c-ori" placeholder="Punto A: Origen" class="input" oninput="window.autocompletar(this, 'sug-ori')">
            <div id="sug-ori" class="sugerencias"></div>
        </div>
        <input type="text" id="c-ref-ori" placeholder="Referencia de recogida (Ej: Casa portón azul)" class="input">

        <div class="input-group">
            <input type="text" id="c-des" placeholder="Punto B: Destino" class="input" oninput="window.autocompletar(this, 'sug-des')">
            <div id="sug-des" class="sugerencias"></div>
        </div>
        <input type="text" id="c-ref-des" placeholder="Referencia de entrega (Ej: Local comercial)" class="input">

        <div id="panel-resumen" class="hidden">
            <div class="box-cotiza">
                <div style="font-size: 20px; font-weight: 800; color: var(--navy);" id="txt-precio">$0.00 MXN</div>
                <div style="font-size: 11px; color: #555;" id="txt-dist">Distancia estimada: 0 km</div>
            </div>
            <input type="text" id="p-desc" placeholder="¿Qué enviamos? (Ej: 2 Hamburguesas)" class="input">
            <button class="btn btn-ok" id="btn-solicitar" onclick="window.confirmarPedido()">SOLICITAR SERVICIO</button>
        </div>

        <div style="text-align: center; margin-top: 10px;">
            <button onclick="window.resetApp()" style="background:none; border:none; color:var(--navy); font-size:11px; font-weight:600; cursor:pointer; text-decoration:underline;">Limpiar puntos</button>
            <br><br>
            <button onclick="window.logout()" style="background:none; border:none; color:red; font-size:11px; font-weight:bold; cursor:pointer;">❌ CERRAR SESIÓN</button>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey:            "AIzaSyC-X3BN11rTG66DWe3njD81zZh_oy5p2hY",
  authDomain:        "enviaya-d8f34.firebaseapp.com",
  projectId:         "enviaya-d8f34",
  storageBucket:     "enviaya-d8f34.firebasestorage.app",
  messagingSenderId: "491320152351",
  appId:             "1:491320152351:web:9bde727d7edaf2d5f3e02a"
};

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let MAP, markerA, markerB, polyline;
    let coordsA = null, coordsB = null;
    let eligiendoOrigen = true;

    // Inicialización del Mapa
    window.onload = () => {
        MAP = L.map('map', { zoomControl: false }).setView([21.8853, -102.2916], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(MAP);
        
        MAP.on('click', (e) => window.marcarEnMapa(e.latlng.lat, e.latlng.lng));
        setTimeout(() => MAP.invalidateSize(), 500);
    };

    // Lógica para marcar Puntos
    window.marcarEnMapa = async (lat, lng, forzarTexto = true) => {
        if (eligiendoOrigen) {
            if (markerA) MAP.removeLayer(markerA);
            if (polyline) MAP.removeLayer(polyline);
            markerA = L.marker([lat, lng]).addTo(MAP);
            coordsA = {lat, lng};
            if(forzarTexto) await reverseGeocode(lat, lng, 'c-ori');
            eligiendoOrigen = false;
            document.getElementById('btn-gps').innerText = "🏁 FIJAR DESTINO CON GPS";
        } else {
            if (markerB) MAP.removeLayer(markerB);
            markerB = L.marker([lat, lng]).addTo(MAP);
            coordsB = {lat, lng};
            if(forzarTexto) await reverseGeocode(lat, lng, 'c-des');
            eligiendoOrigen = true;
            document.getElementById('btn-gps').innerText = "📍 FIJAR ORIGEN CON GPS";
            actualizarRuta();
        }
    };

    async function reverseGeocode(lat, lng, fieldId) {
        try {
            const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
            const d = await r.json();
            document.getElementById(fieldId).value = d.display_name.split(',').slice(0,3).join(',');
        } catch(e) { console.log("Error geocoding"); }
    }

    // Autocompletado manual
    window.autocompletar = async (input, listId) => {
        const list = document.getElementById(listId);
        if (input.value.length < 4) { list.style.display = 'none'; return; }

        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${input.value}, Aguascalientes&limit=4`);
        const data = await r.json();
        list.innerHTML = '';
        list.style.display = 'block';

        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'sug-item';
            div.innerText = item.display_name.split(',').slice(0,3).join(',');
            div.onclick = () => {
                input.value = div.innerText;
                list.style.display = 'none';
                window.marcarEnMapa(parseFloat(item.lat), parseFloat(item.lon), false);
            };
            list.appendChild(div);
        });
    };

    // Cálculo de Ruta y Precio
    async function actualizarRuta() {
        if (!coordsA || !coordsB) return;
        const r = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordsA.lng},${coordsA.lat};${coordsB.lng},${coordsB.lat}?overview=full&geometries=geojson`);
        const d = await r.json();
        
        const dist = (d.routes[0].distance / 1000).toFixed(2);
        const precio = Math.max(50, dist * 11);

        if (polyline) MAP.removeLayer(polyline);
        polyline = L.polyline(d.routes[0].geometry.coordinates.map(c => [c[1], c[0]]), {color: '#0A3D91', weight: 5}).addTo(MAP);
        MAP.fitBounds(polyline.getBounds(), {padding: [30, 30]});

        document.getElementById('txt-precio').innerText = `$${precio.toFixed(2)} MXN`;
        document.getElementById('txt-dist').innerText = `Distancia real: ${dist} km`;
        document.getElementById('panel-resumen').classList.remove('hidden');
    }

    window.obtenerGPS = () => {
        navigator.geolocation.getCurrentPosition(p => window.marcarEnMapa(p.coords.latitude, p.coords.longitude));
    };

    // Firebase: Guardar Pedido
    window.confirmarPedido = async () => {
        const btn = document.getElementById('btn-solicitar');
        btn.disabled = true; btn.innerText = "PROCESANDO...";
        try {
            await addDoc(collection(db, "pedidos"), {
                origen: document.getElementById('c-ori').value,
                destino: document.getElementById('c-des').value,
                monto: document.getElementById('txt-precio').innerText,
                descripcion: document.getElementById('p-desc').value,
                creado: serverTimestamp()
            });
            alert("✅ Pedido enviado con éxito");
            window.resetApp();
        } catch (e) { alert("❌ Error al conectar con Firebase"); }
        btn.disabled = false; btn.innerText = "SOLICITAR SERVICIO";
    };

    window.resetApp = () => {
        location.reload(); // Restaura el estado limpio como en la imagen inicial
    };

    window.logout = () => {
        if(confirm("¿Cerrar sesión?")) window.location.href = "index.html";
    };
</script>
</body>
</html>
